name: CI

# Every push and PR is verified. Only a push to main that passes EVERY check
# deploys -- the deploy job `needs` the others, so a red test blocks production.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; runs on main always finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck · unit · integration · perf · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Backup and Rollback only ever run from main (schedule / manual), so a
      # mistake in them would otherwise surface exactly when you need them.
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + Convex integration tests (with coverage)
        run: npm run test:coverage

      - name: Performance budgets (chat analysis)
        run: npm run test:perf

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

  e2e:
    name: End-to-end (real backend, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The local Convex backend + dashboard binaries (version pinned in
      # scripts/e2e-backend.mjs). Cached so most runs download nothing.
      - name: Cache local Convex backend
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-local-${{ runner.os }}-${{ hashFiles('scripts/e2e-backend.mjs') }}

      - name: Fetch local Convex backend (authenticated, with retries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-convex-backend.sh

      # Spins up an anonymous local Convex backend (no account, no secrets)
      # plus the production build pointed at it. See scripts/e2e-backend.mjs.
      - name: Playwright
        # Print the throwaway backend's startup log, so a hang shows why.
        env:
          E2E_VERBOSE: "1"
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
