name: CI

# Every push and PR is verified. Only a push to main that passes EVERY check
# deploys -- the deploy job `needs` the others, so a red test blocks production.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; runs on main always finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck · unit · integration · perf · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + Convex integration tests (with coverage)
        run: npm run test:coverage

      - name: Performance budgets (chat analysis)
        run: npm run test:perf

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

  e2e:
    name: End-to-end (real backend, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The local Convex backend + dashboard binaries (version pinned in
      # scripts/e2e-backend.mjs). Cached so most runs download nothing.
      - name: Cache local Convex backend
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-local-${{ runner.os }}-${{ hashFiles('scripts/e2e-backend.mjs') }}

      - name: Fetch local Convex backend (authenticated, with retries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-convex-backend.sh

      # Spins up an anonymous local Convex backend (no account, no secrets)
      # plus the production build pointed at it. See scripts/e2e-backend.mjs.
      - name: Playwright
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pushes Convex functions/schema to production, then builds the
      # frontend with VITE_CONVEX_URL automatically set to that deployment's
      # URL (so it never drifts from what --from-file/manual deploys use).
      # The other VITE_* vars are optional -- Maps/TURN just show their
      # "not connected" fallback state if these secrets aren't set.
      - name: Deploy Convex backend and build frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
